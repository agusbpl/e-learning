name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      LEARNING_DATA_DIR: /tmp/glosa-ci-data
      OPENROUTER_API_KEY: ''
      FREELLMAPI_API_KEY: ''
      INTERN_API_KEY: ''
      GLOSA_MARGEN_DIR: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional PDF author runtime
        run: |
          python -m venv .venv-author
          .venv-author/bin/python -m pip install -r requirements-author.txt
      - name: Standard library suite
        run: python -m unittest discover -s tests -v
      - name: Author MCP integration on temporary data
        run: .venv-author/bin/python scripts/check_author_mcp.py

  browser:
    runs-on: ubuntu-latest
    env:
      LEARNING_DATA_DIR: /tmp/glosa-ci-data
      OPENROUTER_API_KEY: ''
      FREELLMAPI_API_KEY: ''
      INTERN_API_KEY: ''
      GLOSA_MARGEN_DIR: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install optional PDF author runtime
        run: |
          python -m venv .venv-author
          .venv-author/bin/python -m pip install -r requirements-author.txt
      - name: Install browser runner
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser scenarios on temporary data
        run: npm run test:browser
